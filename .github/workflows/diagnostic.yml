name: Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: test-${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - basic
          - config_parsing_matching
          - dry_run
          - matching
          - parsing
          - provider_resilience
          - runtime
          - scraper_ultrapc
          - sites
          - storage
          - storage_alerts
          - telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_${{ matrix.module }}.py --no-cov
