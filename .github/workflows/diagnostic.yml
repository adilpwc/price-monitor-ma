name: Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  mypy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src/price_monitor/config.py

  mypy-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: mypy src/price_monitor/scrapers/html.py

  tests:
    name: test-${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: 403
            node: test_http_403_is_not_retried_and_is_explicit
          - case: url
            node: test_product_urls_are_canonicalized_and_external_domains_rejected
          - case: providers
            node: test_new_active_provider_fixtures
          - case: policy
            node: test_provider_activation_policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/test_provider_resilience.py::${{ matrix.node }} --no-cov
