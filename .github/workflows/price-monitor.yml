name: Price monitor

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Exécuter sans Telegram
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Restore latest database cache
        uses: actions/cache/restore@v4
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}
          restore-keys: |
            prices-db-
      - name: Monitor prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=()
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then args+=(--dry-run); fi
          price-monitor-ma "${args[@]}"
      - name: Save database cache
        if: ${{ success() }}
        uses: actions/cache/save@v4
        with:
          path: data/prices.db
          key: prices-db-${{ github.run_id }}
      - name: Upload database backup
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: prices-db-${{ github.run_id }}
          path: data/prices.db
          retention-days: 30
          if-no-files-found: error
