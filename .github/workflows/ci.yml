name: CI
on:
  push:
    branches: [main]
    paths-ignore: ["data/prices.db"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=price_monitor --cov-report=term-missing
