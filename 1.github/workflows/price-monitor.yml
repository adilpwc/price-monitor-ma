name: Surveillance des prix

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Exécuter sans envoyer Telegram"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: price-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer le projet
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Lancer la surveillance
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          price-monitor-ma "${args[@]}"

      - name: Persister l'historique SQLite
        if: always() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ ! -f data/prices.db ]]; then
            echo "Aucune base à persister"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          if git diff --cached --quiet; then
            echo "Aucun changement d'historique"
            exit 0
          fi
          git commit -m "chore(data): update price history [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
